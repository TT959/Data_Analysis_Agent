services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build: .
    command: python main.py
    env_file:
      - .env
    environment:
      # 容器内覆盖：走队列 + 对象存储
      TASK_BACKEND: celery
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: analyst
      LOG_JSON: "true"
    ports:
      - "8000:8000"
    volumes:
      # API 与 Worker 共享上传/产出目录，分析阶段仍可读本地路径
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./src/data:/app/src/data
    depends_on:
      - redis
      - minio

  worker:
    build: .

    command: celery -A src.worker.celery_app.celery_app worker -Q analysis -c 2 -l INFO
    env_file:
      - .env
    environment:
      TASK_BACKEND: celery
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: analyst
      LOG_JSON: "true"
    volumes:
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
      - ./src/data:/app/src/data
    depends_on:
      - redis
      - minio
      - api

volumes:
  redis_data:
  minio_data:
